server.port=8082
spring.application.name=reservas-service
# Por defecto H2 en memoria (desarrollo/tests). En Docker se pisa con DB_URL/DB_USER/DB_PASSWORD (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:reservasdb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# URL del otro servicio (en Docker: ACTIVIDADES_URL=http://actividades:8081)
actividades.url=${ACTIVIDADES_URL:http://localhost:8081}
# API pública de clima (Open-Meteo, sin API key)
clima.url=${CLIMA_URL:https://api.open-meteo.com}

# Zona de confianza: secreto interno (se exige y se envia hacia Actividades)
seguridad.gateway-secret=${GATEWAY_SECRET:dev-secret}
