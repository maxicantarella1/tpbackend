# ==========================================================================================
# DESPLIEGUE INTEGRAL DEL TPI BACKEND 2026 — DOMINIO 5 (TURISMO Y EXCURSIONES)
# ==========================================================================================
# Levanta toda la solución con un solo comando:
#   docker compose up -d --build
#
# Componentes desplegados:
#   - postgres     (5432) : DBMS relacional con dos bases separadas (actividadesdb y reservasdb)
#   - keycloak     (8180) : Identity Provider OIDC/JWT con el realm "turismo" preimportado
#   - actividades  (8081) : Microservicio funcional dueño del catálogo, prestadores y cupo diario
#   - reservas     (8082) : Microservicio funcional orquestador de reservas y 3 APIs externas
#   - api-gateway  (8080) : Punto único de entrada al backend (Routing + Security Filter JWT)
# ==========================================================================================

services:

  # 1. Base de datos relacional (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: tpi-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-turismo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turismo}
      POSTGRES_DB: actividadesdb   # base inicial; reservasdb la crea postgres-init/init-multiple-dbs.sql
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data   # volumen: los datos sobreviven a 'docker compose down' (se borran con 'down -v')
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turismo -d actividadesdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Identity Provider (Keycloak 26)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: tpi-keycloak
    command: start-dev --import-realm   # modo desarrollo (HTTP, sin TLS) e importa keycloak/turismo-realm.json al iniciar
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      # Asegura que el claim "iss" sea siempre http://localhost:8180/realms/turismo tanto desde Postman como entre contenedores
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  # 3. Microservicio Funcional de Actividades (Catálogo, Prestadores y Cupo por Día)
  actividades:
    build:
      context: .
      dockerfile: actividadSpring/Dockerfile
    container_name: tpi-actividades
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/actividadesdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-turismo}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-turismo}
      # ISSUER = nombre PÚBLICO del emisor (el que queda dentro del token); JWK = dirección INTERNA de Docker para bajar las claves
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/turismo
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/turismo/protocol/openid-connect/certs
      ACTIVIDADES_SEED_ENABLED: "true"   # carga 2 prestadores y 3 actividades de demo si la base está vacía
    ports:
      - "8081:8081"

  # 4. Microservicio Funcional de Reservas (Orquestador + Clima, Aire y Feriados)
  reservas:
    build:
      context: .
      dockerfile: ReservaSpring/Dockerfile
    container_name: tpi-reservas
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      actividades:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reservasdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-turismo}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-turismo}
      ACTIVIDADES_URL: http://actividades:8081   # llamada servicio-a-servicio por la red interna de Docker (el nombre del servicio es el host)
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/turismo
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/turismo/protocol/openid-connect/certs
      # Dónde pide su token de cuenta de servicio (client credentials) para llamar a Actividades
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/turismo/protocol/openid-connect/token
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-reservas-secret}
    ports:
      - "8082:8082"

  # 5. API Gateway + Security Filter (Punto único de entrada al Backend)
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: tpi-api-gateway
    depends_on:
      keycloak:
        condition: service_started
      actividades:
        condition: service_started
      reservas:
        condition: service_started
    environment:
      ACTIVIDADES_URL: http://actividades:8081
      RESERVAS_URL: http://reservas:8082   # destinos internos del ruteo del gateway (los puertos 8081/8082 también quedan publicados para depurar)
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/turismo
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/turismo/protocol/openid-connect/certs
    ports:
      - "8080:8080"

volumes:
  postgres_data:
