# Despliegue integral: docker compose up --build
# Solo se publican el API Gateway (:8080) y Keycloak (:8180). Los microservicios y la base de datos
# quedan en la red interna "turismo" (zona de confianza) y NO son alcanzables desde afuera.
services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [turismo]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # El "iss" de los tokens es siempre esta URL pública, aunque el Gateway lo consulte como http://keycloak:8080
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [turismo]

  actividades:
    build:
      context: .
      dockerfile: docker/actividades.Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/actividades_db
      DB_USER: actividades
      DB_PASSWORD: actividades
      GATEWAY_SECRET: ${GATEWAY_SECRET:-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [turismo]

  reservas:
    build:
      context: .
      dockerfile: docker/reservas.Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/reservas_db
      DB_USER: reservas
      DB_PASSWORD: reservas
      ACTIVIDADES_URL: http://actividades:8081
      GATEWAY_SECRET: ${GATEWAY_SECRET:-dev-secret}
      # CLIMA_URL: API pública Open-Meteo (queda fuera de la infraestructura; ver C2)
    depends_on:
      postgres:
        condition: service_healthy
      actividades:
        condition: service_started
    networks: [turismo]

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    environment:
      URL_ACTIVIDADES: http://actividades:8081
      URL_RESERVAS: http://reservas:8082
      KEYCLOAK_ISSUER: http://localhost:8180/realms/turismo
      KEYCLOAK_JWKS: http://keycloak:8080/realms/turismo/protocol/openid-connect/certs
      GATEWAY_SECRET: ${GATEWAY_SECRET:-dev-secret}
    ports:
      - "8080:8080"
    depends_on:
      - actividades
      - reservas
      - keycloak
    networks: [turismo]

networks:
  turismo:

volumes:
  pgdata:
