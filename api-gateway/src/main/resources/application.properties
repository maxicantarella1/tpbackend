server.port=8080
spring.application.name=api-gateway

# Destinos internos (en Docker: http://actividades:8081 y http://reservas:8082)
gateway.url-actividades=${URL_ACTIVIDADES:http://localhost:8081}
gateway.url-reservas=${URL_RESERVAS:http://localhost:8082}

# Keycloak (IdP). issuer-uri valida el claim "iss"; jwk-set-uri evita depender del discovery al arrancar
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8180/realms/turismo}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS:http://localhost:8180/realms/turismo/protocol/openid-connect/certs}

# Zona de confianza: secreto que el Gateway agrega a cada pedido hacia los servicios
seguridad.gateway-secret=${GATEWAY_SECRET:dev-secret}

management.endpoints.web.exposure.include=health
