server.port=8081
# Por defecto H2 en memoria (desarrollo/tests). En Docker se pisa con DB_URL/DB_USER/DB_PASSWORD (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:actividadesdb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Zona de confianza: solo se atienden pedidos con este secreto (lo envia el Gateway)
seguridad.gateway-secret=${GATEWAY_SECRET:dev-secret}
